<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Music Player</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#141e30,#243b55);
      color:white;
    }

    .music-player{
      width:350px;
      background:#111;
      padding:25px;
      border-radius:20px;
      box-shadow:0 10px 25px rgba(0,0,0,0.5);
    }

    .cover img{
      width:100%;
      border-radius:15px;
      margin-bottom:20px;
    }

    .song-info{
      text-align:center;
      margin-bottom:20px;
    }

    .song-info h2{
      font-size:24px;
      margin-bottom:5px;
    }

    .song-info p{
      color:#bbb;
      font-size:15px;
    }

    .progress-container{
      width:100%;
      height:6px;
      background:#444;
      border-radius:10px;
      cursor:pointer;
      margin:15px 0;
    }

    .progress{
      height:100%;
      width:0%;
      background:#1db954;
      border-radius:10px;
    }

    .time{
      display:flex;
      justify-content:space-between;
      font-size:13px;
      color:#ccc;
      margin-bottom:15px;
    }

    .controls{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:20px;
      margin-bottom:20px;
    }

    .controls button{
      border:none;
      background:#1db954;
      color:white;
      width:55px;
      height:55px;
      border-radius:50%;
      font-size:20px;
      cursor:pointer;
      transition:0.3s;
    }

    .controls button:hover{
      transform:scale(1.1);
      background:#17a74a;
    }

    .volume{
      margin-bottom:20px;
    }

    .volume label{
      display:block;
      margin-bottom:8px;
      font-size:14px;
    }

    .volume input{
      width:100%;
      cursor:pointer;
    }

    .playlist{
      max-height:150px;
      overflow-y:auto;
    }

    .playlist h3{
      margin-bottom:10px;
      font-size:18px;
    }

    .playlist ul{
      list-style:none;
    }

    .playlist li{
      padding:10px;
      background:#222;
      margin-bottom:8px;
      border-radius:10px;
      cursor:pointer;
      transition:0.3s;
    }

    .playlist li:hover,
    .playlist .active{
      background:#1db954;
    }

    @media(max-width:400px){
      .music-player{
        width:95%;
      }
    }

  </style>
</head>

<body>

  <div class="music-player">

   
    <div class="cover">
      <img id="cover" src="https://picsum.photos/400/300" alt="cover">
    </div>

   
    <div class="song-info">
      <h2 id="title">Song Title</h2>
      <p id="artist">Artist Name</p>
    </div>

    
    <div class="progress-container" id="progress-container">
      <div class="progress" id="progress"></div>
    </div>

    <div class="time">
      <span id="current-time">0:00</span>
      <span id="duration">0:00</span>
    </div>
    <div class="controls">
      <button id="prev">⏮</button>
      <button id="play">▶</button>
      <button id="next">⏭</button>
    </div>
    <div class="volume">
      <label>Volume</label>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
    </div>
    <div class="playlist">
      <h3>Playlist</h3>
      <ul id="playlist"></ul>
    </div>
    <audio id="audio"></audio>
  </div>
  <script>
    const songs = [
      {
        title: "Dreams",
        artist: "Alex Music",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
        cover: "https://picsum.photos/id/237/400/300"
      },
      {
        title: "Night Vibes",
        artist: "DJ Sky",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
        cover: "https://picsum.photos/id/238/400/300"
      },
      {
        title: "Chill Beat",
        artist: "Nova",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
        cover: "https://picsum.photos/id/239/400/300"
      }
    ];
    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("play");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");

    const title = document.getElementById("title");
    const artist = document.getElementById("artist");
    const cover = document.getElementById("cover");

    const progress = document.getElementById("progress");
    const progressContainer = document.getElementById("progress-container");

    const currentTimeEl = document.getElementById("current-time");
    const durationEl = document.getElementById("duration");

    const volumeSlider = document.getElementById("volume");

    const playlist = document.getElementById("playlist");

    let songIndex = 0;
    let isPlaying = false;
    function loadSong(song){
      title.textContent = song.title;
      artist.textContent = song.artist;
      audio.src = song.src;
      cover.src = song.cover;

      updatePlaylistActive();
    }

    loadSong(songs[songIndex]);

  
    function playSong(){
      isPlaying = true;
      audio.play();
      playBtn.textContent = "⏸";
    }

    
    function pauseSong(){
      isPlaying = false;
      audio.pause();
      playBtn.textContent = "▶";
    }

    
    playBtn.addEventListener("click", () => {
      isPlaying ? pauseSong() : playSong();
    });

    
    function nextSong(){
      songIndex++;

      if(songIndex > songs.length - 1){
        songIndex = 0;
      }

      loadSong(songs[songIndex]);
      playSong();
    }

    
    function prevSong(){
      songIndex--;

      if(songIndex < 0){
        songIndex = songs.length - 1;
      }

      loadSong(songs[songIndex]);
      playSong();
    }

    nextBtn.addEventListener("click", nextSong);
    prevBtn.addEventListener("click", prevSong);

    
    audio.addEventListener("timeupdate", (e) => {

      const { duration, currentTime } = e.srcElement;

      const progressPercent = (currentTime / duration) * 100;
      progress.style.width = `${progressPercent}%`;

    
      const durationMinutes = Math.floor(duration / 60);
      const durationSeconds = Math.floor(duration % 60);

      if(durationSeconds < 10){
        durationEl.textContent =
          `${durationMinutes}:0${durationSeconds}`;
      } else {
        durationEl.textContent =
          `${durationMinutes}:${durationSeconds}`;
      }

      const currentMinutes = Math.floor(currentTime / 60);
      const currentSeconds = Math.floor(currentTime % 60);

      if(currentSeconds < 10){
        currentTimeEl.textContent =
          `${currentMinutes}:0${currentSeconds}`;
      } else {
        currentTimeEl.textContent =
          `${currentMinutes}:${currentSeconds}`;
      }

    });

    
    progressContainer.addEventListener("click", (e) => {

      const width = progressContainer.clientWidth;
      const clickX = e.offsetX;

      const duration = audio.duration;

      audio.currentTime = (clickX / width) * duration;

    });

    
    volumeSlider.addEventListener("input", () => {
      audio.volume = volumeSlider.value;
    });

    
    audio.addEventListener("ended", nextSong);

    
    function createPlaylist(){

      songs.forEach((song, index) => {

        const li = document.createElement("li");

        li.textContent = `${song.title} - ${song.artist}`;

        li.addEventListener("click", () => {
          songIndex = index;
          loadSong(songs[songIndex]);
          playSong();
        });

        playlist.appendChild(li);

      });

    }

    createPlaylist();

    
    function updatePlaylistActive(){

      const items = playlist.querySelectorAll("li");

      items.forEach((item, index) => {

        item.classList.remove("active");

        if(index === songIndex){
          item.classList.add("active");
        }

      });

    }

  </script>

</body>
</html>
